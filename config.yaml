profiles:
- id: profile_coder_app
  groups:
  - developers
  definition:
    display_name: Code Server
    description: Code Server for development
    slug: coder_app
    default: false
    kubespawner_override:
      cpu_limit: 2
      cpu_guarantee: 1
      mem_limit: 6G
      mem_guarantee: 4G
      image: ghcr.io/terradue/coder:2024.11
      extra_resource_limits: {}
      extra_resource_guarantees: {}
  config_maps:
  - name: bash-login
    key: bash-login
    mount_path: /workspace/.bash_login
    default_mode: '0660'
    readonly: true
    content: 'source /workspace/.bashrc



      code_app'
    persist: true
  - name: bash-rc
    key: bash-rc
    mount_path: /workspace/.bashrc
    default_mode: '0660'
    readonly: true
    content: "alias ll=\"ls -l\"\n\n# >>> conda initialize >>>\n# !! Contents within\
      \ this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda'\
      \ 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\
      \nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        .\
      \ \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\
      \n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\"\
      \ ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize\
      \ <<<"
    persist: true
  - name: init
    key: init
    mount_path: /opt/init/.init.sh
    default_mode: '0660'
    readonly: true
    content: echo "Initializing environment..."
    persist: true
  volumes:
  - name: calrissian-volume
    claim_name: calrissian-claim
    size: 25Gi
    storage_class: standard
    access_modes:
    - ReadWriteMany
    volume_mount:
      name: calrissian-volume
      mount_path: /calrissian
    persist: false
  - name: workspace-volume
    claim_name: workspace-claim
    size: 10Gi
    storage_class: standard
    access_modes:
    - ReadWriteOnce
    volume_mount:
      name: workspace-volume
      mount_path: /workspace
    persist: true
  pod_env_vars:
    HOME: /workspace
    CONDA_ENVS_PATH: /workspace/.envs
    CONDARC: /workspace/.condarc
    XDG_RUNTIME_DIR: /workspace/.local
    XDG_CONFIG_HOME: /workspace/.local
    XDG_DATA_HOME: /workspace/.local/share/
    CWLTOOL_OPTIONS: --podman
  node_selector: {}
  role_bindings: []
  image_pull_secrets: []
  init_containers:
  - name: init-file-on-volume
    image: ghcr.io/terradue/coder:2024.11
    command:
    - sh
    - -c
    - sh /opt/init/.init.sh
    volume_mounts:
    - name: calrissian-volume
      mount_path: /calrissian
    - name: workspace-volume
      mount_path: /workspace
    - name: init
      mount_path: /opt/init/.init.sh
      sub_path: init
- id: profile_gpu_coder_app
  groups:
  - developers
  definition:
    display_name: GPU Code Server
    description: Code Server with GPU acceleration
    slug: gpu_coder_app
    default: false
    kubespawner_override:
      cpu_limit: 8
      cpu_guarantee: 4
      mem_limit: 32G
      mem_guarantee: 16G
      image: ghcr.io/terradue/coder:latest
      extra_resource_limits:
        nvidia.com/gpu: 1
      extra_resource_guarantees: {}
  config_maps:
  - name: bash-login
    key: bash-login
    mount_path: /workspace/.bash_login
    default_mode: '0660'
    readonly: true
    content: 'source /workspace/.bashrc



      gpu_coder_app'
    persist: true
  - name: bash-rc
    key: bash-rc
    mount_path: /workspace/.bashrc
    default_mode: '0660'
    readonly: true
    content: "alias ll=\"ls -l\"\n\n# >>> conda initialize >>>\n# !! Contents within\
      \ this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda'\
      \ 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\
      \nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        .\
      \ \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\
      \n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\"\
      \ ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize\
      \ <<<"
    persist: true
  - name: init
    key: init
    mount_path: /opt/init/.init.sh
    default_mode: '0660'
    readonly: true
    content: echo "Initializing environment..."
    persist: true
  volumes:
  - name: calrissian-volume
    claim_name: calrissian-claim
    size: 50Gi
    storage_class: standard
    access_modes:
    - ReadWriteMany
    volume_mount:
      name: calrissian-volume
      mount_path: /calrissian
    persist: false
  - name: workspace-volume
    claim_name: workspace-claim
    size: 20Gi
    storage_class: standard
    access_modes:
    - ReadWriteOnce
    volume_mount:
      name: workspace-volume
      mount_path: /workspace
    persist: true
  pod_env_vars:
    HOME: /workspace
    CONDA_ENVS_PATH: /workspace/.envs
    CONDARC: /workspace/.condarc
    XDG_RUNTIME_DIR: /workspace/.local
    XDG_CONFIG_HOME: /workspace/.local
    XDG_DATA_HOME: /workspace/.local/share/
    CWLTOOL_OPTIONS: --podman
  node_selector:
    nvidia.com/gpu.present: 'true'
  role_bindings: []
  image_pull_secrets: []
  init_containers:
  - name: init-file-on-volume
    image: ghcr.io/terradue/coder:latest
    command:
    - sh
    - -c
    - sh /opt/init/.init.sh
    volume_mounts:
    - name: calrissian-volume
      mount_path: /calrissian
    - name: workspace-volume
      mount_path: /workspace
    - name: init
      mount_path: /opt/init/.init.sh
      sub_path: init
