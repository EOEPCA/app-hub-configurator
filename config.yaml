    persist: true
  - name: init
    key: init
    mount_path: /opt/init/.init.sh
    default_mode: '0660'
    readonly: true
    content: echo "Initializing environment..."
    persist: true
  volumes:
  - name: calrissian-volume
    claim_name: calrissian-claim
    size: 50Gi
    storage_class: standard
    access_modes:
    - ReadWriteMany
    volume_mount:
      name: calrissian-volume
      mount_path: /calrissian
    persist: false
  - name: workspace-volume
    claim_name: workspace-claim
    size: 20Gi
    storage_class: standard
    access_modes:
    - ReadWriteOnce
    volume_mount:
      name: workspace-volume
      mount_path: /workspace
    persist: true
  pod_env_vars:
    HOME: /workspace
    CONDA_ENVS_PATH: /workspace/.envs
    CONDARC: /workspace/.condarc
    XDG_RUNTIME_DIR: /workspace/.local
    XDG_CONFIG_HOME: /workspace/.local
    XDG_DATA_HOME: /workspace/.local/share/
    CWLTOOL_OPTIONS: --podman
  node_selector:
    nvidia.com/gpu.present: 'true'
  role_bindings: []
  image_pull_secrets: []
  init_containers:
  - name: init-file-on-volume
    image: ghcr.io/terradue/coder:latest
    command:
    - sh
    - -c
    - sh /opt/init/.init.sh
    volume_mounts:
    - name: calrissian-volume
      mount_path: /calrissian
    - name: workspace-volume
      mount_path: /workspace
    - name: init
      mount_path: /opt/init/.init.sh
      sub_path: init
  manifests: []
