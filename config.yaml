profiles:
- config_maps:
  - content: source /workspace/.bashrc
    default_mode: '0660'
    key: bash-login-apex-jupyter-lab-app
    mount_path: /workspace/.bash_login
    name: bash-login-apex-jupyter-lab-app
    persist: false
    readonly: true
  - content: "alias ll=\"ls -l\"\nalias aws=\"aws --endpoint-url=http://localstack:4566\"\nexport AWS_ACCESS_KEY_ID=test\nexport AWS_SECRET_ACCESS_KEY=test\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=http://localstack:4566\nexport PATH=/workspace/.venv/bin:/workspace:$PATH\n# >>> conda initialize >>>\n# !! Contents within this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda' 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        . \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\" ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize <<<\n"
    default_mode: '0660'
    key: bash-rc
    mount_path: /workspace/.bashrc
    name: bash-rc-apex-jupyter-lab-app
    persist: false
    readonly: true
  - content: "#!/bin/bash\nset -x \n\ncd /workspace\n# -------------------------\n# Clone repositories\n# -------------------------\nrm -rf eoap openeo\nmkdir -p eoap\ncd eoap\ngit clone https://github.com/eoap/cwl-eoap.git\ngit clone https://github.com/eoap/stac-eoap.git\ngit clone https://github.com/eoap/quickwin.git\ncd /workspace\nmkdir -p openeo\ncd openeo\ngit clone --no-checkout https://github.com/Open-EO/openeo-community-examples.git\ncd openeo-community-examples\ngit sparse-checkout init --cone\ngit sparse-checkout set \\\n  \"python/1. GettingStarted/GettingStarted.ipynb\" \\\n  \"python/LoadStac/load-stac-item-example.ipynb\" \\\n  \"python/BioPAR/biopar_service.ipynb\"\ngit checkout main\ngit checkout 738d1710918ad937c2d79c49436c6e7ca2abd3dd -- \\\n  python/BioPAR/biopar_service.ipynb\n\n\ncd /workspace\n# -------------------------\n# Python virtual environment\n# -------------------------\npython -m venv /workspace/.venv\n. /workspace/.venv/bin/activate\n\n/workspace/.venv/bin/python -m pip install --no-cache-dir \\\n  openeo \\\n  click \\\n  asyncclick \\\n  click-logging \\\n  requests \\\n  numpy \\\n  tqdm \\\n  tabulate \\\n  ipython \\\n  ipykernel \\\n  loguru \\\n  shapely \\\n  pyproj \\\n  rasterio \\\n  scikit-image \\\n  pystac \\\n  pystac-client \\\n  stactools \\\n  stactools-sentinel2 \\\n  stac-asset \\\n  rio-stac \\\n  boto3 \\\n  graphviz \\\n  yq \\\n  cwl-utils \\\n  cwl-loader \\\n  eoap-cwlwrap \\\n  mkdocs-material \\\n  mkdocs-mermaid2-plugin \\\n  anyio \\\n  matplotlib\n\n/workspace/.venv/bin/python -m pip install --no-cache-dir cwltool==3.1.20241112140730 ipykernel \n# -------------------------\n# Register Jupyter kernel\n# -------------------------\n/workspace/.venv/bin/python -m ipykernel install \\\n    --prefix=/workspace/.local \\\n    --name OpenEO \\\n    --display-name \"OpenEO\"\n\n\n# -------------------------\n# Env\n# -------------------------\nchmod -R 777 /workspace/.local\nchmod -R 777 /workspace/eoap/\nchmod -R 777 /workspace/openeo/\nmkdir -p /workspace/.podman\nchmod -R 777 /workspace/.venv/\nchown -R 1001:100 /workspace/.podman\nchmod -R 775 /workspace/.podman\n\nexport PATH=$PATH:/workspace/.venv/bin\n## AWS environment variables\nexport AWS_ACCESS_KEY_ID=test\nexport AWS_SECRET_ACCESS_KEY=test\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=http://localstack:4566\n\nexport AWS_ENDPOINT_URL=http://localstack:4566\n\naws s3 mb s3://results --endpoint-url=${AWS_ENDPOINT_URL} || true\n"
    default_mode: '0660'
    key: init
    mount_path: /opt/init/.init.sh
    name: init-apex-jupyter-lab-app
    persist: false
    readonly: true
  definition:
    default: false
    description: Interactive development environment for notebooks, code, and data
    display_name: Jupyter Lab
    kubespawner_override:
      cpu_guarantee: 1
      cpu_limit: 2
      extra_resource_guarantees: {}
      extra_resource_limits: {}
      image: ghcr.io/eoepca/iat-jupyterlab:latest-dev
      mem_guarantee: 4G
      mem_limit: 6G
    slug: apex_jupyter_lab_app
  env_from_config_maps: []
  env_from_secrets: []
  groups:
  - group-a
  - group-b
  id: profile_apex_jupyter_lab_app
  image_pull_secrets: []
  init_containers:
  - command:
    - sh
    - -c
    - sh /opt/init/.init.sh
    image: ghcr.io/eoepca/iat-jupyterlab:latest-dev
    name: init-file-on-volume
    volume_mounts:
    - mount_path: /workspace
      name: workspace-volume
    - mount_path: /opt/init/.init.sh
      name: init-apex-jupyter-lab-app
      sub_path: init
  manifests:
  - content:
    - apiVersion: helm.crossplane.io/v1beta1
      kind: Release
