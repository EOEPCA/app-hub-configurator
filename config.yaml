          values:
            service:
              type: ClusterIP
            serviceAccount:
              create: true
        providerConfigRef:
          name: helm-provider
    - apiVersion: v1
      data:
        AWS_ACCESS_KEY_ID: dGVzdA==
        AWS_DEFAULT_REGION: dXMtZWFzdC0x
        AWS_SECRET_ACCESS_KEY: dGVzdA==
      kind: Secret
      metadata:
        name: localstack-s3-secret-coder-app
        namespace: '{{ namespace }}'
