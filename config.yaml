    - apiVersion: v1
      data:
        ENV_VAR1: value1
        ENV_VAR2: value2
      kind: ConfigMap
      metadata:
        name: env-var-configmap-coder-app
        namespace: '{{ namespace }}'
    key: jupyter_lab
    name: jupyter_lab-apex-jupyter-lab-app
    persist: false
  node_selector: {}
  pod_env_vars:
    CONDARC: /workspace/.condarc
    CONDA_ENVS_PATH: /workspace/.envs
    CWLTOOL_OPTIONS: --podman
    HOME: /workspace
    JUPYTERHUB_CRYPT_KEY: 6f8b2e9c4d1a7f3b5c9e0d2a4b6f8c1e7d9a3b5c1e7f9a2d4b6c8e0f2a4d6b80
    JUPYTER_PATH: /workspace/.jupyter
    NAMESPACE: '{{ namespace }}'
    NOTEBOOK_ARGS: --notebook-dir=/workspace
    XDG_CONFIG_HOME: /workspace/.podman
    XDG_DATA_HOME: /workspace/.podman/share/
    XDG_RUNTIME_DIR: /workspace/.podman
  role_bindings: []
  secret_mounts: []
  volumes:
  - access_modes:
    - ReadWriteOnce
    claim_name: workspace-claim
    name: workspace-volume
    persist: true
    size: 20Gi
    storage_class: standard
    volume_mount:
      mount_path: /workspace
      name: workspace-volume
- config_maps:
  - content: source /workspace/.bashrc
    default_mode: '0660'
    key: bash-login-apex-coder-app
    mount_path: /workspace/.bash_login
    name: bash-login-apex-coder-app
    persist: false
    readonly: true
  - content: "alias ll=\"ls -l\"\nexport SEAWEEDFS_S3_ENDPOINT=http://seaweedfs-s3:8333\nalias aws=\"aws --endpoint-url=${SEAWEEDFS_S3_ENDPOINT}\"\nexport AWS_ACCESS_KEY_ID=s3\nexport AWS_SECRET_ACCESS_KEY=s3\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=${SEAWEEDFS_S3_ENDPOINT}\n\nexport PATH=/workspace/.venv/bin:/workspace:$PATH\n# >>> conda initialize >>>\n# !! Contents within this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda' 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        . \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\" ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize <<<\n"
    default_mode: '0660'
    key: bash-rc
    mount_path: /workspace/.bashrc
    name: bash-rc-apex-coder-app
    persist: false
    readonly: true
  - content: "#!/bin/bash\nset -x \n\ncd /workspace\n\n# -------------------------\n# Clone repositories\n# -------------------------\nrm -rf eoap openeo\nmkdir -p eoap\ncd eoap\ngit clone https://github.com/eoap/cwl-eoap.git\ngit clone https://github.com/eoap/stac-eoap.git\ngit clone https://github.com/eoap/quickwin.git\n\ncd /workspace\nmkdir -p openeo\ncd openeo\ngit clone --no-checkout https://github.com/Open-EO/openeo-community-examples.git\ncd openeo-community-examples\ngit sparse-checkout init --cone\ngit sparse-checkout set \\\n  \"python/1. GettingStarted/GettingStarted.ipynb\" \\\n  \"python/LoadStac/load-stac-item-example.ipynb\" \\\n  \"python/BioPAR/biopar_service.ipynb\"\ngit checkout main\ngit checkout 738d1710918ad937c2d79c49436c6e7ca2abd3dd -- \\\n  python/BioPAR/biopar_service.ipynb\n\n# -------------------------\n# VS Code extensions\n# -------------------------\n# Install VS Code Extensions\ncode-server --install-extension ms-python.python \ncode-server --install-extension redhat.vscode-yaml\ncode-server --install-extension sbg-rabix.benten-cwl\ncode-server --install-extension ms-toolsai.jupyter\nln -s /workspace/.local/share/code-server/extensions /workspace/extensions\n\n# Setup user settings\nmkdir -p /workspace/User/\necho '{\"workbench.colorTheme\": \"Visual Studio Dark\"}' > /workspace/User/settings.json\necho '[\n            {\n                \"key\": \"ctrl+c\",\n                \"command\": \"workbench.action.terminal.copySelection\",\n                \"when\": \"terminalFocus && terminalTextSelected\"\n            },\n            {\n                \"key\": \"ctrl+v\",\n                \"command\": \"workbench.action.terminal.paste\",\n                \"when\": \"terminalFocus\"\n            }\n            ]' > /workspace/User/keybindings.json\n\n# -------------------------\n# Python virtual environment\n# -------------------------\npython -m venv /workspace/.venv\n. /workspace/.venv/bin/activate\n\n# Upgrade pip and install minimal packages\nchmod -R 777 /workspace/.ipython\n/workspace/.venv/bin/python -m pip install --upgrade pip\npython -m pip install --no-cache-dir \\\n  openeo \\\n  click \\\n  asyncclick \\\n  click-logging \\\n  requests \\\n  numpy \\\n  tqdm \\\n  tabulate \\\n  ipython \\\n  ipykernel \\\n  loguru \\\n  shapely \\\n  pyproj \\\n  rasterio \\\n  scikit-image \\\n  pystac \\\n  pystac-client \\\n  stactools \\\n  stactools-sentinel2 \\\n  stac-asset \\\n  rio-stac \\\n  boto3 \\\n  graphviz \\\n  yq \\\n  cwl-utils \\\n  cwl-loader \\\n  eoap-cwlwrap \\\n  mkdocs-material \\\n  mkdocs-mermaid2-plugin \\\n  anyio \\\n  matplotlib\n/workspace/.venv/bin/python -m pip install --no-cache-dir cwltool==3.1.20241112140730 \n\n# -------------------------\n# Register Jupyter kernel\n# -------------------------\n\n/workspace/.venv/bin/python -m ipykernel install --name openeo-env --display-name \"OpenEO\" --sys-prefix\n# -------------------------\n# Permissions (safe)\n# -------------------------\nmkdir -p /workspace/.podman\nchmod -R 777 /workspace/.local /workspace/.venv /workspace/User \\\n    /workspace/eoap /workspace/openeo /workspace/.podman\n\n## AWS environment variables\nexport SEAWEEDFS_S3_ENDPOINT=http://seaweedfs-s3:8333\nexport AWS_ACCESS_KEY_ID=s3\nexport AWS_SECRET_ACCESS_KEY=s3\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=${SEAWEEDFS_S3_ENDPOINT}\n\naws s3 mb s3://results --endpoint-url=${AWS_ENDPOINT_URL} || true\n"
    default_mode: '0660'
    key: init
    mount_path: /opt/init/.init.sh
    name: init-apex-coder-app
    persist: false
    readonly: true
  definition:
    default: false
    description: Develop Application Packages at scale
    display_name: Code Server
    kubespawner_override:
      cpu_guarantee: 1
      cpu_limit: 2
      extra_resource_guarantees: {}
      extra_resource_limits: {}
      image: ghcr.io/eoepca/pde-code-server:latest-dev
      mem_guarantee: 4G
      mem_limit: 6G
    slug: apex_coder_app
  env_from_config_maps: []
  env_from_secrets: []
  groups:
  - group-a
  - group-b
  id: profile_apex_coder_app
  image_pull_secrets: []
  init_containers:
  - command:
    - sh
    - -c
    - sh /opt/init/.init.sh
    image: ghcr.io/eoepca/pde-code-server:latest-dev
    name: init-file-on-volume
    volume_mounts:
    - mount_path: /calrissian
      name: calrissian-volume
    - mount_path: /workspace
      name: workspace-volume
    - mount_path: /opt/init/.init.sh
      name: init-apex-coder-app
      sub_path: init
  manifests:
  - content:
    - apiVersion: v1
      data:
        s3.json: "{\n  \"identities\": [\n    {\n      \"name\": \"default\",\n      \"credentials\": [\n        {\n          \"accessKey\": \"s3\",\n          \"secretKey\": \"s3\"\n        }\n      ],\n      \"actions\": [\"Admin\", \"Read\", \"Write\", \"List\"]\n    }\n  ]\n}\n"
      kind: ConfigMap
      metadata:
        name: seaweedfs-s3-config
        namespace: '{{ namespace }}'
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: seaweedfs-s3-pvc
        namespace: '{{ namespace }}'
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: standard
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: seaweedfs-s3-deployment
        namespace: '{{ namespace }}'
      spec:
        forProvider:
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: seaweedfs-s3
              namespace: '{{ namespace }}'
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: seaweedfs-s3
              template:
                metadata:
                  labels:
                    app: seaweedfs-s3
                spec:
                  containers:
                  - args:
                    - server
                    - -s3
                    - -s3.config=/etc/seaweedfs/s3.json
                    - -dir=/data
                    image: chrislusf/seaweedfs:latest
                    name: seaweedfs
                    ports:
                    - containerPort: 8333
                    readinessProbe:
                      initialDelaySeconds: 2
                      periodSeconds: 2
                      tcpSocket:
                        port: 8333
                    resources:
                      limits:
                        cpu: 500m
                        memory: 512Mi
                      requests:
                        cpu: 100m
                        memory: 128Mi
                    volumeMounts:
                    - mountPath: /etc/seaweedfs
                      name: config
                    - mountPath: /data
                      name: data
                  volumes:
                  - configMap:
                      name: seaweedfs-s3-config
                    name: config
                  - name: data
                    persistentVolumeClaim:
                      claimName: seaweedfs-s3-pvc
        providerConfigRef:
          name: kubernetes-provider
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: seaweedfs-s3-service
        namespace: '{{ namespace }}'
      spec:
        forProvider:
          manifest:
            apiVersion: v1
            kind: Service
            metadata:
              name: seaweedfs-s3
              namespace: '{{ namespace }}'
            spec:
              ports:
              - port: 8333
                targetPort: 8333
              selector:
                app: seaweedfs-s3
        providerConfigRef:
          name: kubernetes-provider
    - apiVersion: v1
      data:
        AWS_ENDPOINT_URL: http://seaweedfs-s3:8333
        SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      kind: ConfigMap
      metadata:
        name: env-var-configmap-coder-app
        namespace: '{{ namespace }}'
    key: coder
    name: coder-apex-coder-app
    persist: false
  node_selector: {}
  pod_env_vars:
    CONDARC: /workspace/.condarc
    CONDA_ENVS_PATH: /workspace/.envs
    CWLTOOL_OPTIONS: --podman
    HOME: /workspace
    JUPYTERHUB_CRYPT_KEY: 6f8b2e9c4d1a7f3b5c9e0d2a4b6f8c1e7d9a3b5c1e7f9a2d4b6c8e0f2a4d6b80
    NAMESPACE: '{{ namespace }}'
    XDG_CONFIG_HOME: /workspace/.podman
    XDG_DATA_HOME: /workspace/.podman/share/
    XDG_RUNTIME_DIR: /workspace/.podman
  role_bindings:
  - name: log-reader-role-binding-apex-coder-app
    persist: false
    role:
      api_groups:
      - ''
      name: log-reader-role-apex-coder-app
      resources:
      - pods
      - pods/log
      verbs:
      - get
      - list
      - watch
    subjects:
    - kind: ServiceAccount
      name: default
  - name: pod-reader-role-binding-apex-coder-app
    persist: false
    role:
      api_groups:
      - ''
      name: pod-manager-role-apex-coder-app
      resources:
      - pods
      verbs:
      - create
      - patch
      - delete
      - list
      - watch
      - get
    subjects:
    - kind: ServiceAccount
      name: default
  - name: pod-exec-role-binding-apex-coder-app
    persist: false
    role:
      api_groups:
      - ''
      name: pod-exec-role-apex-coder-app
      resources:
      - pods/exec
      verbs:
      - create
    subjects:
    - kind: ServiceAccount
      name: default
  - name: job-submitter-role-binding-apex-coder-app
    persist: false
    role:
      api_groups:
      - batch
      name: job-submitter-role-apex-coder-app
      resources:
      - jobs
      verbs:
      - create
      - delete
      - list
      - watch
      - get
    subjects:
    - kind: ServiceAccount
      name: default
  secret_mounts: []
  volumes:
  - access_modes:
    - ReadWriteMany
    claim_name: calrissian-claim
    name: calrissian-volume
    persist: false
    size: 20Gi
    storage_class: standard
    volume_mount:
      mount_path: /calrissian
      name: calrissian-volume
  - access_modes:
    - ReadWriteOnce
    claim_name: workspace-claim
    name: workspace-volume
    persist: true
    size: 20Gi
    storage_class: standard
    volume_mount:
      mount_path: /workspace
      name: workspace-volume
- config_maps:
  - content: . /workspace/.bashrc
    default_mode: '0660'
    key: bash-login-apex-remote-qgis-desktop-app
    mount_path: /workspace/.bash_login
    name: bash-login-apex-remote-qgis-desktop-app
    persist: false
    readonly: true
  - content: "alias ll=\"ls -l\"\nexport PATH=/workspace/.venv/bin:/workspace:$PATH\n# >>> conda initialize >>>\n# !! Contents within this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda' 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        . \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\" ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize <<<\n"
    default_mode: '0660'
    key: bash-rc
    mount_path: /workspace/.bashrc
    name: bash-rc-apex-remote-qgis-desktop-app
    persist: false
    readonly: true
  - content: "echo \"Initializing remote desktop environment...\"\n\nmkdir -p /workspace/.local/share/QGIS/QGIS3/\n\nchmod -R 700 /workspace/.local\nconda activate env_qgis\ncat > /workspace/.local/share/QGIS/QGIS3/startup.py <<'EOF'\nfrom qgis.PyQt.QtCore import QSettings, QTimer\n\ndef xyz_exists(name: str) -> bool:\n    s = QSettings()\n    return s.contains(f\"qgis/connections-xyz/{name}/url\")\n\ndef wms_exists(name: str) -> bool:\n    s = QSettings()\n    return s.contains(f\"qgis/connections-wms/{name}/url\")\n\ndef ensure_xyz(name: str, url: str, zmin: int = 0, zmax: int = 19, hidden: bool = False):\n    print(f\"[startup] {'Creating' if not xyz_exists(name) else 'Updating'} XYZ: {name}\")\n    s = QSettings()\n    base = f\"qgis/connections-xyz/{name}\"\n    s.setValue(f\"{base}/url\", url)\n    s.setValue(f\"{base}/zmin\", zmin)\n    s.setValue(f\"{base}/zmax\", zmax)\n    s.setValue(f\"{base}/hidden\", hidden)\n\ndef ensure_wms(name: str, url: str, hidden: bool = False):\n    print(f\"[startup] {'Creating' if not wms_exists(name) else 'Updating'} WMS: {name}\")\n    s = QSettings()\n    base = f\"qgis/connections-wms/{name}\"\n    s.setValue(f\"{base}/url\", url)\n    s.setValue(f\"{base}/hidden\", hidden)\n\ndef ensure_stac():\n    try:\n        from qgis.core import QgsStacConnection, QgsHttpHeaders\n        stac_name = \"eoresults-stac\"\n        existing = QgsStacConnection.connectionList()\n        if stac_name not in existing:\n            print(f\"[startup] Creating STAC connection: {stac_name}\")\n            headers = QgsHttpHeaders({\"referer\": \"https://eoresults.esa.int/stac\"})\n            stac_data = QgsStacConnection.Data()\n            stac_data.name = stac_name\n            stac_data.url = \"https://eoresults.esa.int/stac\"\n            stac_data.username = \"\"\n            stac_data.password = \"\"\n            stac_data.authCfg = \"\"\n            stac_data.httpHeaders = headers\n            QgsStacConnection.addConnection(stac_name, stac_data)\n            QgsStacConnection.setSelectedConnection(stac_name)\n            print(f\"[startup] STAC connection added: {stac_name}\")\n        else:\n            print(f\"[startup] STAC connection already exists: {stac_name}\")\n    except Exception as e:\n        print(f\"[startup] STAC connection setup skipped: {e}\")\n\ndef _refresh_browser():\n    try:\n        from qgis.utils import iface\n        iface.browserModel().refresh()\n        print(\"[startup] Browser model refreshed\")\n    except Exception as e:\n        print(f\"[startup] Browser refresh skipped: {e}\")\n\ndef apply_standard_connections():\n    # WMS\n    ensure_wms(\"Copernicus Urban Atlas\",\n               \"https://image.discomap.eea.europa.eu/arcgis/services/UrbanAtlas/UA_UrbanAtlas_2018/MapServer/WMSServer\")\n    ensure_wms(\"Corine Land Cover 2018\",\n               \"https://image.discomap.eea.europa.eu/arcgis/services/Corine/CLC2018_WM/MapServer/WMSServer\")\n    ensure_wms(\"Coastal Zones Land Cover Land Use 2018\",\n               \"https://image.discomap.eea.europa.eu/arcgis/services/CoastalZones/CZ_CoastalZones_2018/MapServer/WMSServer\")\n\n    # XYZ\n    ensure_xyz(\"OpenTopoMap\", \"https://tile.opentopomap.org/{z}/{x}/{y}.png\", 0, 17)\n    ensure_xyz(\"Google Dynamic World\", \"https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}\", 0, 20)\n    ensure_xyz(\"CartoDB Dark Matter\", \"https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png\", 0, 19)\n\n    # STAC\n    ensure_stac()\n\n    # Refresh browser a few times (sometimes needed)\n    _refresh_browser()\n    QTimer.singleShot(1500, _refresh_browser)\n    QTimer.singleShot(4000, _refresh_browser)\n\n    print(\"[startup] NOTE: provider connection reload API not available in this build; \"\n          \"XYZ/WMS/STAC may only appear after restart.\")\n\nQTimer.singleShot(2000, apply_standard_connections)\n\nEOF\n"
    default_mode: '0660'
    key: init
    mount_path: /opt/init/.init.sh
    name: init-apex-remote-qgis-desktop-app
    persist: false
    readonly: true
  default_url: /desktop
  definition:
    default: false
    description: Spatial visualization and decision-making tools for everyone
    display_name: QGIS on a Remote Desktop
    kubespawner_override:
      cpu_guarantee: 1
      cpu_limit: 2
      extra_resource_guarantees: {}
      extra_resource_limits: {}
      image: ghcr.io/eoepca/iga-remote-desktop-qgis:latest-dev
      mem_guarantee: 4G
      mem_limit: 6G
    slug: apex_remote_qgis_desktop_app
  env_from_config_maps: []
  env_from_secrets: []
  groups:
  - group-a
  - group-b
  id: profile_apex_remote_qgis_desktop_app
  image_pull_secrets: []
  init_containers:
  - command:
    - sh
    - -c
    - sh /opt/init/.init.sh
    image: ghcr.io/eoepca/iga-remote-desktop-qgis:latest-dev
    name: init-file-on-volume
    volume_mounts:
    - mount_path: /workspace
      name: workspace-volume
    - mount_path: /opt/init/.init.sh
      name: init-apex-remote-qgis-desktop-app
      sub_path: init
  manifests: []
  node_selector: {}
  pod_env_vars:
    CONDARC: /workspace/.condarc
    CONDA_ENVS_PATH: /workspace/.envs
    CWLTOOL_OPTIONS: --podman
    HOME: /workspace
    XDG_CONFIG_HOME: /workspace/.local
    XDG_DATA_HOME: /workspace/.local/share/
    XDG_RUNTIME_DIR: /workspace/.local
  role_bindings: []
  secret_mounts: []
  volumes:
  - access_modes:
    - ReadWriteOnce
    claim_name: workspace-claim
    name: workspace-volume
    persist: true
    size: 20Gi
    storage_class: standard
    volume_mount:
      mount_path: /workspace
      name: workspace-volume
