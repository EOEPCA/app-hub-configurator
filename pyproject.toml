[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-hub-configurator"
dynamic = ["version"]
description = 'configurator for the Application Hub'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pydantic>=2.0.0",
  "pyyaml",
  "click",
  "ruamel.yaml>=0.17.21",
]

[project.urls]
Documentation = "https://github.com/eoepca/app-hub-configurator"
Issues = "https://github.com/eoepca/app-hub-configurator/issues"
Source = "https://github.com/eoepca/app-hub-configurator"

[tool.hatch.version]
path = "configurator/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:configurator tests}"

[tool.coverage.run]
source_pkgs = ["configurator", "tests"]
branch = true
parallel = true
omit = [
  "configurator/__about__.py",
]

[tool.coverage.paths]
configurator = ["configurator", "*/configurator"]
tests = ["tests", "*/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]


[tool.hatch.envs.default]
dependencies = [
  "pydantic",
  "pyyaml",
  "click",
]

[project.scripts]
dump-config = "configurator.main:main"

[tool.hatch.envs.test]
description = "Test environment"
dependencies = [
  "pytest>=8.0",
]

[tool.hatch.envs.test.scripts]
test = "pytest"
test-q = "pytest -q"
test-cov = "pytest --cov=configurator"
test-show-setup = "pytest --setup-show"


[tool.hatch.envs.dev]
description = "Development environment"
dependencies = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff",
]


[tool.hatch.envs.dev.scripts]
lint = "ruff format configurator tests data"
check = "ruff check --fix configurator tests data"
lint-ci = "ruff format --check configurator tests data"
check-ci = "ruff check configurator tests data"


[tool.hatch.envs.docs]
description = "MkDocs documentation environment"
dependencies = [
  "mkdocs-material",
  "mkdocs-macros-plugin",
  "mkdocs-git-revision-date-localized-plugin",
  "mkdocs-minify-plugin",
]

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
build = "mkdocs build --strict"

[tool.hatch.build.targets.wheel]
packages = ["configurator"]

[tool.hatch.build.targets.sdist]
include = [
  "/configurator",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]
