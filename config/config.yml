                    - -s3
                    - -s3.config=/etc/seaweedfs/s3.json
                    - -dir=/data
                    image: chrislusf/seaweedfs:latest
                    name: seaweedfs
                    ports:
                    - containerPort: 8333
                    readinessProbe:
                      initialDelaySeconds: 2
                      periodSeconds: 2
                      tcpSocket:
                        port: 8333
                    resources:
                      limits:
                        cpu: 500m
                        memory: 512Mi
                      requests:
                        cpu: 100m
                        memory: 128Mi
                    volumeMounts:
                    - mountPath: /etc/seaweedfs
                      name: config
                    - mountPath: /data
                      name: data
                  volumes:
                  - configMap:
                      name: seaweedfs-s3-config
                    name: config
                  - name: data
                    persistentVolumeClaim:
                      claimName: seaweedfs-s3-pvc
        providerConfigRef:
          name: kubernetes-provider
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: seaweedfs-s3-service
