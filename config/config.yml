- config_maps:
  - content: . /workspace/.bashrc
    default_mode: '0660'
    key: bash-login-remote-qgis-desktop-app-profile
    mount_path: /workspace/.bash_login
    name: bash-login-remote-qgis-desktop-app-profile
    persist: false
    readonly: true
  - content: "alias ll=\"ls -l\"\nexport PATH=/workspace/.apex/envs/openeo/bin:/workspace/.apex/envs/eoap/bin:/workspace:$PATH\n# >>> conda initialize >>>\n# !! Contents within this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda' 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        . \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\" ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize <<<\n"
    default_mode: '0660'
    key: bash-rc-remote-qgis-desktop-app-profile
    mount_path: /workspace/.bashrc
    name: bash-rc-remote-qgis-desktop-app-profile
    persist: false
    readonly: true
  - content: "#!/bin/bash\nset -eux\n\nWORKSPACE_ROOT=/workspace\nAPEX_ROOT=\"${WORKSPACE_ROOT}/.apex\"\nSHARED_ROOT=\"${WORKSPACE_ROOT}/shared\"\nRUNTIME_ROOT=\"${APEX_ROOT}/runtime/qgis\"\nQGIS_PROFILE_DIR=\"${RUNTIME_ROOT}/share/QGIS/QGIS3\"\n\ninstall -d -m 775 \"${WORKSPACE_ROOT}/.local\"\ninstall -d -m 775 \"${RUNTIME_ROOT}/run\"\ninstall -d -m 775 \"${RUNTIME_ROOT}/config\"\ninstall -d -m 775 \"${RUNTIME_ROOT}/share\"\ninstall -d -m 775 \"${QGIS_PROFILE_DIR}\"\ninstall -d -m 775 \"${SHARED_ROOT}\"\ninstall -d -m 775 \"${SHARED_ROOT}/results\"\ninstall -d -m 775 \"${SHARED_ROOT}/notebooks\"\ninstall -d -m 775 \"${SHARED_ROOT}/qgis\"\n\ncat > \"${SHARED_ROOT}/README.txt\" <<'EOF'\nShared APEx workspace\n\nUse this workspace to move results between profiles.\n- Save notebooks and generated rasters under /workspace/shared/notebooks or /workspace/shared/results\n- Open the same files from the QGIS profile under /workspace/shared\nEOF\n\ncat > \"${QGIS_PROFILE_DIR}/startup.py\" <<'EOF'\nfrom pathlib import Path\n\nfrom qgis.PyQt.QtCore import QSettings, QTimer\n\nWORKSPACE_ROOT = Path(\"/workspace\")\nSHARED_ROOT = WORKSPACE_ROOT / \"shared\"\nRESULTS_ROOT = SHARED_ROOT / \"results\"\n\n\ndef xyz_exists(name: str) -> bool:\n    s = QSettings()\n    return s.contains(f\"qgis/connections-xyz/{name}/url\")\n\n\ndef wms_exists(name: str) -> bool:\n    s = QSettings()\n    return s.contains(f\"qgis/connections-wms/{name}/url\")\n\n\ndef ensure_xyz(name: str, url: str, zmin: int = 0, zmax: int = 19, hidden: bool = False):\n    print(f\"[startup] {'Creating' if not xyz_exists(name) else 'Updating'} XYZ: {name}\")\n    s = QSettings()\n    base = f\"qgis/connections-xyz/{name}\"\n    s.setValue(f\"{base}/url\", url)\n    s.setValue(f\"{base}/zmin\", zmin)\n    s.setValue(f\"{base}/zmax\", zmax)\n    s.setValue(f\"{base}/hidden\", hidden)\n\n\ndef ensure_wms(name: str, url: str, hidden: bool = False):\n    print(f\"[startup] {'Creating' if not wms_exists(name) else 'Updating'} WMS: {name}\")\n    s = QSettings()\n    base = f\"qgis/connections-wms/{name}\"\n    s.setValue(f\"{base}/url\", url)\n    s.setValue(f\"{base}/hidden\", hidden)\n\n\ndef ensure_stac():\n    try:\n        from qgis.core import QgsStacConnection, QgsHttpHeaders\n\n        stac_name = \"eoresults-stac\"\n        existing = QgsStacConnection.connectionList()\n        if stac_name not in existing:\n            print(f\"[startup] Creating STAC connection: {stac_name}\")\n            headers = QgsHttpHeaders({\"referer\": \"https://eoresults.esa.int/stac\"})\n            stac_data = QgsStacConnection.Data()\n            stac_data.name = stac_name\n            stac_data.url = \"https://eoresults.esa.int/stac\"\n            stac_data.username = \"\"\n            stac_data.password = \"\"\n            stac_data.authCfg = \"\"\n            stac_data.httpHeaders = headers\n            QgsStacConnection.addConnection(stac_name, stac_data)\n            QgsStacConnection.setSelectedConnection(stac_name)\n            print(f\"[startup] STAC connection added: {stac_name}\")\n        else:\n            print(f\"[startup] STAC connection already exists: {stac_name}\")\n    except Exception as exc:\n        print(f\"[startup] STAC connection setup skipped: {exc}\")\n\n\ndef ensure_workspace_dirs():\n    SHARED_ROOT.mkdir(parents=True, exist_ok=True)\n    RESULTS_ROOT.mkdir(parents=True, exist_ok=True)\n    (SHARED_ROOT / \"notebooks\").mkdir(parents=True, exist_ok=True)\n    (SHARED_ROOT / \"qgis\").mkdir(parents=True, exist_ok=True)\n    print(f\"[startup] Shared workspace available at {SHARED_ROOT}\")\n\n\ndef _refresh_browser():\n    try:\n        from qgis.utils import iface\n\n        iface.browserModel().refresh()\n        print(\"[startup] Browser model refreshed\")\n    except Exception as exc:\n        print(f\"[startup] Browser refresh skipped: {exc}\")\n\n\ndef apply_standard_connections():\n    ensure_workspace_dirs()\n\n    ensure_wms(\n        \"Copernicus Urban Atlas\",\n        \"https://image.discomap.eea.europa.eu/arcgis/services/UrbanAtlas/UA_UrbanAtlas_2018/MapServer/WMSServer\"\
      ,\n    )\n    ensure_wms(\n        \"Corine Land Cover 2018\",\n        \"https://image.discomap.eea.europa.eu/arcgis/services/Corine/CLC2018_WM/MapServer/WMSServer\",\n    )\n    ensure_wms(\n        \"Coastal Zones Land Cover Land Use 2018\",\n        \"https://image.discomap.eea.europa.eu/arcgis/services/CoastalZones/CZ_CoastalZones_2018/MapServer/WMSServer\",\n    )\n\n    ensure_xyz(\"OpenTopoMap\", \"https://tile.opentopomap.org/{z}/{x}/{y}.png\", 0, 17)\n    ensure_xyz(\"Google Dynamic World\", \"https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}\", 0, 20)\n    ensure_xyz(\"CartoDB Dark Matter\", \"https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png\", 0, 19)\n\n    ensure_stac()\n    _refresh_browser()\n    QTimer.singleShot(1500, _refresh_browser)\n    QTimer.singleShot(4000, _refresh_browser)\n\n    print(\n        \"[startup] Shared APEx workspace ready. Browse /workspace/shared to open rasters \"\n        \"produced from Jupyter Lab or Code Server.\"\n    )\n\n\nQTimer.singleShot(2000, apply_standard_connections)\nEOF\n"
    default_mode: '0660'
    key: init-remote-qgis-desktop-app-profile
    mount_path: /opt/init/.init.sh
    name: init-remote-qgis-desktop-app-profile
    persist: false
    readonly: true
