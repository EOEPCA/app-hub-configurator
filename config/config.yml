profiles:
- config_maps:
  - content: source /workspace/.bashrc
    default_mode: '0660'
    key: bash-login-coder-app-profile
    mount_path: /workspace/.bash_login
    name: bash-login-coder-app-profile
    persist: false
    readonly: true
  - content: "alias ll=\"ls -l\"\nexport SEAWEEDFS_S3_ENDPOINT=http://seaweedfs-s3:8333\nalias aws=\"aws --endpoint-url=${SEAWEEDFS_S3_ENDPOINT}\"\nexport AWS_ACCESS_KEY_ID=s3\nexport AWS_SECRET_ACCESS_KEY=s3\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=${SEAWEEDFS_S3_ENDPOINT}\n\nexport PATH=/workspace/.apex/envs/openeo/bin:/workspace/.apex/envs/eoap/bin:/workspace:$PATH\n# >>> conda initialize >>>\n# !! Contents within this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda' 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        . \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\" ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize <<<\n"
    default_mode: '0660'
    key: bash-rc-coder-app-profile
    mount_path: /workspace/.bashrc
    name: bash-rc-coder-app-profile
    persist: false
    readonly: true
  - content: "#!/bin/bash\nset -eux\n\nWORKSPACE_ROOT=/workspace\nAPEX_ROOT=\"${WORKSPACE_ROOT}/.apex\"\nSHARED_ROOT=\"${WORKSPACE_ROOT}/shared\"\nEXAMPLES_ROOT=\"${WORKSPACE_ROOT}/examples\"\nEOAP_ROOT=\"${EXAMPLES_ROOT}/eoap\"\nOPENEO_ROOT=\"${EXAMPLES_ROOT}/openeo\"\nOPENEO_EXAMPLES_DIR=\"${OPENEO_ROOT}/openeo-community-examples\"\nEOAP_VENV=\"${APEX_ROOT}/envs/eoap\"\nOPENEO_VENV=\"${APEX_ROOT}/envs/openeo\"\nRUNTIME_ROOT=\"${APEX_ROOT}/runtime/coder\"\nRESULTS_ROOT=\"${SHARED_ROOT}/results\"\nJUPYTER_SHARED_PATH=\"${WORKSPACE_ROOT}/.local/share/jupyter\"\n\nensure_dir() {\n  install -d -m 775 \"$1\"\n}\n\nensure_git_checkout() {\n  repo_url=\"$1\"\n  target_dir=\"$2\"\n  branch=\"${3:-main}\"\n\n  if [ ! -d \"${target_dir}/.git\" ]; then\n    git clone \"${repo_url}\" \"${target_dir}\"\n  else\n    git -C \"${target_dir}\" fetch origin \"${branch}\" || true\n    git -C \"${target_dir}\" checkout \"${branch}\" || true\n    git -C \"${target_dir}\" pull --ff-only origin \"${branch}\" || true\n  fi\n}\n\nensure_openeo_examples() {\n  if [ ! -d \"${OPENEO_EXAMPLES_DIR}/.git\" ]; then\n    git clone --no-checkout https://github.com/Open-EO/openeo-community-examples.git \"${OPENEO_EXAMPLES_DIR}\"\n  fi\n\n  git -C \"${OPENEO_EXAMPLES_DIR}\" sparse-checkout init --cone\n  git -C \"${OPENEO_EXAMPLES_DIR}\" sparse-checkout set \\\n    \"python/1. GettingStarted/GettingStarted.ipynb\" \\\n    \"python/LoadStac/LoadBiomassSTAC.ipynb\" \\\n    \"python/LoadStac/LoadLandsatSTAC.ipynb\" \\\n    \"python/LoadStac/load-stac-item-example.ipynb\" \\\n    \"python/BioPAR/biopar_service.ipynb\"\n  git -C \"${OPENEO_EXAMPLES_DIR}\" checkout main || true\n  git -C \"${OPENEO_EXAMPLES_DIR}\" pull --ff-only origin main || true\n  git -C \"${OPENEO_EXAMPLES_DIR}\" checkout 738d1710918ad937c2d79c49436c6e7ca2abd3dd -- \\\n    python/BioPAR/biopar_service.ipynb\n}\n\nensure_python_env() {\n  env_dir=\"$1\"\n  shift\n\n  if [ ! -x \"${env_dir}/bin/python\" ]; then\n    python -m venv \"${env_dir}\"\n  fi\n\n  \"${env_dir}/bin/python\" -m pip install --upgrade pip\n  \"${env_dir}/bin/python\" -m pip install --no-cache-dir \"$@\"\n}\n\nensure_workspace_layout() {\n  ensure_dir \"${WORKSPACE_ROOT}/.local\"\n  ensure_dir \"${JUPYTER_SHARED_PATH}\"\n  ensure_dir \"${APEX_ROOT}/envs\"\n  ensure_dir \"${RUNTIME_ROOT}/run\"\n  ensure_dir \"${RUNTIME_ROOT}/config\"\n  ensure_dir \"${RUNTIME_ROOT}/share\"\n  ensure_dir \"${RUNTIME_ROOT}/containers\"\n  ensure_dir \"${SHARED_ROOT}\"\n  ensure_dir \"${RESULTS_ROOT}\"\n  ensure_dir \"${SHARED_ROOT}/notebooks\"\n  ensure_dir \"${SHARED_ROOT}/qgis\"\n  ensure_dir \"${EOAP_ROOT}\"\n  ensure_dir \"${OPENEO_ROOT}\"\n\n  cat > \"${SHARED_ROOT}/README.txt\" <<'EOF'\nShared APEx workspace\n\nUse this workspace to move results between profiles.\n- Save notebooks and generated rasters under /workspace/shared/notebooks or /workspace/shared/results\n- Open the same files from the QGIS profile under /workspace/shared\nEOF\n}\n\ncd \"${WORKSPACE_ROOT}\"\nensure_workspace_layout\n\nensure_git_checkout https://github.com/eoap/cwl-eoap.git \"${EOAP_ROOT}/cwl-eoap\"\nensure_git_checkout https://github.com/eoap/stac-eoap.git \"${EOAP_ROOT}/stac-eoap\"\nensure_git_checkout https://github.com/eoap/quickwin.git \"${EOAP_ROOT}/quickwin\"\nensure_openeo_examples\n\ncode-server --install-extension ms-python.python\ncode-server --install-extension redhat.vscode-yaml\ncode-server --install-extension sbg-rabix.benten-cwl\ncode-server --install-extension ms-toolsai.jupyter\nln -sfn /workspace/.local/share/code-server/extensions /workspace/extensions\n\ninstall -d -m 775 /workspace/User\ncat > /workspace/User/settings.json <<'EOF'\n{\"workbench.colorTheme\": \"Visual Studio Dark\"}\nEOF\ncat > /workspace/User/keybindings.json <<'EOF'\n[\n  {\n    \"key\": \"ctrl+c\",\n    \"command\": \"workbench.action.terminal.copySelection\",\n    \"when\": \"terminalFocus && terminalTextSelected\"\n  },\n  {\n    \"key\": \"ctrl+v\",\n    \"command\": \"workbench.action.terminal.paste\",\n    \"when\": \"terminalFocus\"\n  }\n]\nEOF\n\nensure_python_env
      \"${EOAP_VENV}\" \\\n  click \\\n  anyio \\\n  asyncclick \\\n  boto3 \\\n  cwl-loader==0.20.0 \\\n  cwl-utils \\\n  eoap-cwlwrap \\\n  graphviz \\\n  ipykernel \\\n  ipython \\\n  loguru \\\n  nest_asyncio \\\n  numpy \\\n  pyproj \\\n  pyyaml \\\n  pystac \\\n  rasterio \\\n  rio-stac \\\n  scikit-image \\\n  shapely \\\n  stac-asset\n\"${EOAP_VENV}/bin/python\" -m pip install --no-cache-dir cwltool==3.1.20241112140730\n\nensure_python_env \"${OPENEO_VENV}\" \\\n  openeo \\\n  ipykernel \\\n  ipython \\\n  matplotlib \\\n  numpy \\\n  pystac \\\n  rasterio \\\n  seaborn \\\n  xarray\n\n\"${OPENEO_VENV}/bin/python\" -m ipykernel install \\\n  --prefix=\"${WORKSPACE_ROOT}/.local\" \\\n  --name openeo-env \\\n  --display-name \"OpenEO\"\n\"${EOAP_VENV}/bin/python\" -m ipykernel install \\\n  --prefix=\"${WORKSPACE_ROOT}/.local\" \\\n  --name eoap-env \\\n  --display-name \"EOAP\"\n\nexport SEAWEEDFS_S3_ENDPOINT=http://seaweedfs-s3:8333\nexport AWS_ACCESS_KEY_ID=s3\nexport AWS_SECRET_ACCESS_KEY=s3\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=\"${SEAWEEDFS_S3_ENDPOINT}\"\n\naws s3 mb s3://results --endpoint-url=\"${AWS_ENDPOINT_URL}\" || true\n"
    default_mode: '0660'
    key: init-coder-app-profile
    mount_path: /opt/init/.init.sh
    name: init-coder-app-profile
    persist: false
    readonly: true
  definition:
    default: false
    description: Develop Application Packages at scale
    display_name: Code Server
    kubespawner_override:
      cpu_guarantee: 1
      cpu_limit: 2
      extra_resource_guarantees: {}
      extra_resource_limits: {}
      image: ghcr.io/eoepca/pde-code-server:1.2.0
      mem_guarantee: 4G
      mem_limit: 6G
    slug: coder_app_profile
  env_from_config_maps: []
  env_from_secrets: []
  groups:
  - GROUP_A
  - GROUP_B
  id: profile_coder_app_profile
  image_pull_secrets: []
  init_containers:
  - command:
    - sh
    - -c
    - sh /opt/init/.init.sh
    image: ghcr.io/eoepca/pde-code-server:1.2.0
    name: init-file-on-volume
    volume_mounts:
    - mount_path: /workspace
      name: workspace-volume
    - mount_path: /opt/init/.init.sh
      name: init-coder-app-profile
      sub_path: init-coder-app-profile
  manifests:
  - content:
    - apiVersion: v1
      data:
        s3.json: "{\n  \"identities\": [\n    {\n      \"name\": \"default\",\n      \"credentials\": [\n        {\n          \"accessKey\": \"s3\",\n          \"secretKey\": \"s3\"\n        }\n      ],\n      \"actions\": [\"Admin\", \"Read\", \"Write\", \"List\"]\n    }\n  ]\n}\n"
      kind: ConfigMap
      metadata:
        name: seaweedfs-s3-config
        namespace: '{{ namespace }}'
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: seaweedfs-s3-pvc
        namespace: '{{ namespace }}'
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: seaweedfs-s3-deployment
        namespace: '{{ namespace }}'
      spec:
        forProvider:
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: seaweedfs-s3
              namespace: '{{ namespace }}'
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: seaweedfs-s3
              template:
                metadata:
                  labels:
                    app: seaweedfs-s3
                spec:
                  containers:
                  - args:
                    - server
                    - -s3
                    - -s3.config=/etc/seaweedfs/s3.json
                    - -dir=/data
                    image: chrislusf/seaweedfs:latest
                    name: seaweedfs
                    ports:
                    - containerPort: 8333
                    readinessProbe:
                      initialDelaySeconds: 2
                      periodSeconds: 2
                      tcpSocket:
                        port: 8333
                    resources:
                      limits:
                        cpu: 500m
                        memory: 512Mi
                      requests:
                        cpu: 100m
                        memory: 128Mi
                    volumeMounts:
                    - mountPath: /etc/seaweedfs
                      name: config
                    - mountPath: /data
                      name: data
                  volumes:
                  - configMap:
                      name: seaweedfs-s3-config
                    name: config
                  - name: data
                    persistentVolumeClaim:
                      claimName: seaweedfs-s3-pvc
        providerConfigRef:
          name: kubernetes-provider
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: seaweedfs-s3-service
        namespace: '{{ namespace }}'
      spec:
        forProvider:
          manifest:
            apiVersion: v1
            kind: Service
            metadata:
              name: seaweedfs-s3
              namespace: '{{ namespace }}'
            spec:
              ports:
              - port: 8333
                targetPort: 8333
              selector:
                app: seaweedfs-s3
        providerConfigRef:
          name: kubernetes-provider
    - apiVersion: v1
      data:
        AWS_ENDPOINT_URL: http://seaweedfs-s3:8333
        SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
      kind: ConfigMap
      metadata:
        name: env-var-configmap-coder-app
        namespace: '{{ namespace }}'
    key: coder
    name: coder-coder-app-profile
    persist: false
  node_selector: {}
  pod_env_vars:
    CONDARC: /workspace/.condarc
    CONDA_ENVS_PATH: /workspace/.envs
    CWLTOOL_OPTIONS: --podman
    HOME: /workspace
    NAMESPACE: '{{ namespace }}'
    XDG_CONFIG_HOME: /workspace/.apex/runtime/coder/config
    XDG_DATA_HOME: /workspace/.apex/runtime/coder/share
    XDG_RUNTIME_DIR: /workspace/.apex/runtime/coder/run
  role_bindings:
  - name: log-reader-role-binding-coder-app-profile
    persist: false
    role:
      api_groups:
      - ''
      name: log-reader-role-coder-app-profile
      resources:
      - pods
      - pods/log
      verbs:
      - get
      - list
      - watch
    subjects:
    - kind: ServiceAccount
      name: default
  - name: pod-reader-role-binding-coder-app-profile
    persist: false
    role:
      api_groups:
      - ''
      name: pod-manager-role-coder-app-profile
      resources:
      - pods
      verbs:
      - create
      - patch
      - delete
      - list
      - watch
      - get
    subjects:
    - kind: ServiceAccount
      name: default
  - name: pod-exec-role-binding-coder-app-profile
    persist: false
    role:
      api_groups:
      - ''
      name: pod-exec-role-coder-app-profile
      resources:
      - pods/exec
      verbs:
      - create
    subjects:
    - kind: ServiceAccount
      name: default
  - name: job-submitter-role-binding-coder-app-profile
    persist: false
    role:
      api_groups:
      - batch
      name: job-submitter-role-coder-app-profile
      resources:
      - jobs
      verbs:
      - create
      - delete
      - list
      - watch
      - get
    subjects:
    - kind: ServiceAccount
      name: default
  secret_mounts: []
  volumes:
  - access_modes:
    - ReadWriteOnce
    annotations:
      storageclass.kubernetes.io/is-default-class: 'true'
    claim_name: workspace-claim
    name: workspace-volume
    persist: true
    size: 50Gi
    storage_class: csi-disk
    volume_mount:
      mount_path: /workspace
      name: workspace-volume
- config_maps:
  - content: source /workspace/.bashrc
    default_mode: '0660'
    key: bash-login-jupyter-lab-app-profile
    mount_path: /workspace/.bash_login
    name: bash-login-jupyter-lab-app-profile
    persist: false
    readonly: true
  - content: "alias ll=\"ls -l\"\nalias aws=\"aws --endpoint-url=http://seaweedfs-s3:8333\"\nexport AWS_ACCESS_KEY_ID=s3\nexport AWS_SECRET_ACCESS_KEY=s3\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=http://seaweedfs-s3:8333\nexport PATH=/workspace/.apex/envs/openeo/bin:/workspace/.apex/envs/eoap/bin:/workspace:$PATH\n# >>> conda initialize >>>\n# !! Contents within this block are managed by 'conda init' !!\n__conda_setup=\"$('/opt/conda/bin/conda' 'shell.bash' 'hook' 2> /dev/null)\"\nif [ $? -eq 0 ]; then\n    eval \"$__conda_setup\"\nelse\n    if [ -f \"/opt/conda/etc/profile.d/conda.sh\" ]; then\n        . \"/opt/conda/etc/profile.d/conda.sh\"\n    else\n        export PATH=\"/srv/conda/bin:$PATH\"\n    fi\nfi\nunset __conda_setup\n\nif [ -f \"/opt/conda/etc/profile.d/mamba.sh\" ]; then\n    . \"/opt/conda/etc/profile.d/mamba.sh\"\nfi\n# <<< conda initialize <<<\n"
    default_mode: '0660'
    key: bash-rc-jupyter-lab-app-profile
    mount_path: /workspace/.bashrc
    name: bash-rc-jupyter-lab-app-profile
    persist: false
    readonly: true
  - content: "#!/bin/bash\nset -eux\n\nWORKSPACE_ROOT=/workspace\nAPEX_ROOT=\"${WORKSPACE_ROOT}/.apex\"\nSHARED_ROOT=\"${WORKSPACE_ROOT}/shared\"\nEXAMPLES_ROOT=\"${WORKSPACE_ROOT}/examples\"\nEOAP_ROOT=\"${EXAMPLES_ROOT}/eoap\"\nOPENEO_ROOT=\"${EXAMPLES_ROOT}/openeo\"\nOPENEO_EXAMPLES_DIR=\"${OPENEO_ROOT}/openeo-community-examples\"\nEOAP_VENV=\"${APEX_ROOT}/envs/eoap\"\nOPENEO_VENV=\"${APEX_ROOT}/envs/openeo\"\nRUNTIME_ROOT=\"${APEX_ROOT}/runtime/jupyter\"\nRESULTS_ROOT=\"${SHARED_ROOT}/results\"\nJUPYTER_SHARED_PATH=\"${WORKSPACE_ROOT}/.local/share/jupyter\"\n\nensure_dir() {\n  install -d -m 775 \"$1\"\n}\n\nensure_git_checkout() {\n  repo_url=\"$1\"\n  target_dir=\"$2\"\n  branch=\"${3:-main}\"\n\n  if [ ! -d \"${target_dir}/.git\" ]; then\n    git clone \"${repo_url}\" \"${target_dir}\"\n  else\n    git -C \"${target_dir}\" fetch origin \"${branch}\" || true\n    git -C \"${target_dir}\" checkout \"${branch}\" || true\n    git -C \"${target_dir}\" pull --ff-only origin \"${branch}\" || true\n  fi\n}\n\nensure_openeo_examples() {\n  if [ ! -d \"${OPENEO_EXAMPLES_DIR}/.git\" ]; then\n    git clone --no-checkout https://github.com/Open-EO/openeo-community-examples.git \"${OPENEO_EXAMPLES_DIR}\"\n  fi\n\n  git -C \"${OPENEO_EXAMPLES_DIR}\" sparse-checkout init --cone\n  git -C \"${OPENEO_EXAMPLES_DIR}\" sparse-checkout set \\\n    \"python/1. GettingStarted/GettingStarted.ipynb\" \\\n    \"python/LoadStac/load-stac-item-example.ipynb\" \\\n    \"python/BioPAR/biopar_service.ipynb\"\n  git -C \"${OPENEO_EXAMPLES_DIR}\" checkout main || true\n  git -C \"${OPENEO_EXAMPLES_DIR}\" pull --ff-only origin main || true\n  git -C \"${OPENEO_EXAMPLES_DIR}\" checkout 738d1710918ad937c2d79c49436c6e7ca2abd3dd -- \\\n    python/BioPAR/biopar_service.ipynb\n}\n\nensure_python_env() {\n  env_dir=\"$1\"\n  shift\n\n  if [ ! -x \"${env_dir}/bin/python\" ]; then\n    python -m venv \"${env_dir}\"\n  fi\n\n  \"${env_dir}/bin/python\" -m pip install --upgrade pip\n  \"${env_dir}/bin/python\" -m pip install --no-cache-dir \"$@\"\n}\n\nensure_workspace_layout() {\n  ensure_dir \"${WORKSPACE_ROOT}/.local\"\n  ensure_dir \"${JUPYTER_SHARED_PATH}\"\n  ensure_dir \"${APEX_ROOT}/envs\"\n  ensure_dir \"${RUNTIME_ROOT}/run\"\n  ensure_dir \"${RUNTIME_ROOT}/config\"\n  ensure_dir \"${RUNTIME_ROOT}/share\"\n  ensure_dir \"${RUNTIME_ROOT}/containers\"\n  ensure_dir \"${SHARED_ROOT}\"\n  ensure_dir \"${RESULTS_ROOT}\"\n  ensure_dir \"${SHARED_ROOT}/notebooks\"\n  ensure_dir \"${SHARED_ROOT}/qgis\"\n  ensure_dir \"${EOAP_ROOT}\"\n  ensure_dir \"${OPENEO_ROOT}\"\n\n  cat > \"${SHARED_ROOT}/README.txt\" <<'EOF'\nShared APEx workspace\n\nUse this workspace to move results between profiles.\n- Save notebooks and generated rasters under /workspace/shared/notebooks or /workspace/shared/results\n- Open the same files from the QGIS profile under /workspace/shared\nEOF\n}\n\ncd \"${WORKSPACE_ROOT}\"\nensure_workspace_layout\n\nensure_git_checkout https://github.com/eoap/cwl-eoap.git \"${EOAP_ROOT}/cwl-eoap\"\nensure_git_checkout https://github.com/eoap/stac-eoap.git \"${EOAP_ROOT}/stac-eoap\"\nensure_git_checkout https://github.com/eoap/quickwin.git \"${EOAP_ROOT}/quickwin\"\nensure_openeo_examples\n\nensure_python_env \"${EOAP_VENV}\" \\\n  click \\\n  anyio \\\n  asyncclick \\\n  boto3 \\\n  cwl-loader==0.20.0 \\\n  cwl-utils \\\n  eoap-cwlwrap \\\n  graphviz \\\n  ipykernel \\\n  ipython \\\n  loguru \\\n  nest_asyncio \\\n  numpy \\\n  pyproj \\\n  pyyaml \\\n  pystac \\\n  rasterio \\\n  rio-stac \\\n  scikit-image \\\n  shapely \\\n  stac-asset\n\"${EOAP_VENV}/bin/python\" -m pip install --no-cache-dir cwltool==3.1.20241112140730\n\nensure_python_env \"${OPENEO_VENV}\" \\\n  openeo \\\n  click \\\n  asyncclick \\\n  click-logging \\\n  requests \\\n  numpy \\\n  tqdm \\\n  tabulate \\\n  ipython \\\n  ipykernel \\\n  loguru \\\n  shapely \\\n  pyproj \\\n  rasterio \\\n  scikit-image \\\n  pystac \\\n  pystac-client \\\n  stactools \\\n  stactools-sentinel2 \\\n  stac-asset \\\n  rio-stac \\\n  boto3 \\\n  graphviz \\\n  yq \\\n  cwl-utils \\\n  cwl-loader \\\
      \n  eoap-cwlwrap \\\n  mkdocs-material \\\n  mkdocs-mermaid2-plugin \\\n  anyio \\\n  matplotlib\n\n\"${OPENEO_VENV}/bin/python\" -m ipykernel install \\\n  --prefix=\"${WORKSPACE_ROOT}/.local\" \\\n  --name openeo-env \\\n  --display-name \"OpenEO\"\n\"${EOAP_VENV}/bin/python\" -m ipykernel install \\\n  --prefix=\"${WORKSPACE_ROOT}/.local\" \\\n  --name eoap-env \\\n  --display-name \"EOAP\"\n\nexport PATH=\"${OPENEO_VENV}/bin:${EOAP_VENV}/bin:${PATH}\"\nexport SEAWEEDFS_S3_ENDPOINT=http://seaweedfs-s3:8333\nexport AWS_ACCESS_KEY_ID=s3\nexport AWS_SECRET_ACCESS_KEY=s3\nexport AWS_DEFAULT_REGION=us-east-1\nexport AWS_ENDPOINT_URL=\"${SEAWEEDFS_S3_ENDPOINT}\"\n\naws s3 mb s3://results --endpoint-url=\"${AWS_ENDPOINT_URL}\" || true\n"
