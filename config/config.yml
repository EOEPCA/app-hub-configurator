    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: seaweedfs-s3-pvc
        namespace: '{{ namespace }}'
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: seaweedfs-s3-deployment
        namespace: '{{ namespace }}'
      spec:
        forProvider:
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: seaweedfs-s3
              namespace: '{{ namespace }}'
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: seaweedfs-s3
              template:
                metadata:
                  labels:
                    app: seaweedfs-s3
                spec:
                  containers:
                  - args:
