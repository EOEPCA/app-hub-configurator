      spec:
        forProvider:
          manifest:
            apiVersion: v1
            kind: Service
            metadata:
              name: seaweedfs-s3
              namespace: '{{ namespace }}'
            spec:
              ports:
              - port: 8333
                targetPort: 8333
              selector:
                app: seaweedfs-s3
        providerConfigRef:
          name: kubernetes-provider
    - apiVersion: v1
      data:
