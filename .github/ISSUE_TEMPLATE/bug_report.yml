name: Bug report
description: Report a reproducible bug in app-hub-configurator
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands and configuration used.
      placeholder: |
        1. Run `dump-config ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.8"

  - type: input
    id: package
    attributes:
      label: Package version
      placeholder: "e.g. 0.1.0"

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or traceback
      render: shell

