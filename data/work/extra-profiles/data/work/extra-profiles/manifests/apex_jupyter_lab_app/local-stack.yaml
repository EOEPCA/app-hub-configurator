apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: localstack
  namespace: "{{ namespace }}"
spec:
  forProvider:
    chart:
      name: localstack
      version: "0.6.20"
      repository: https://localstack.github.io/helm-charts
    namespace: "{{ namespace }}"
    skipCreateNamespace: true
    values:
      service:
        type: ClusterIP
      serviceAccount:
        create: true
  providerConfigRef:
    name: helm-provider
---
apiVersion: v1
kind: Secret
metadata:
  name: localstack-s3-secret-coder-app
  namespace: "{{ namespace }}"
type: Opaque
data:
  AWS_DEFAULT_REGION: dXMtZWFzdC0x
  AWS_ACCESS_KEY_ID: dGVzdA==
  AWS_SECRET_ACCESS_KEY: dGVzdA==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-var-configmap-coder-app
  namespace: "{{ namespace }}"
data:
  ENV_VAR1: value1
  ENV_VAR2: value2