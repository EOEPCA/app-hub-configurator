apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: "{{ namespace }}"
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "default",
          "credentials": [
            {
              "accessKey": "s3",
              "secretKey": "s3"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-s3-pvc
  namespace: "{{ namespace }}"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: seaweedfs-s3-deployment
  namespace: "{{ namespace }}"
spec:
  forProvider:
    manifest:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: seaweedfs-s3
        namespace: "{{ namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: seaweedfs-s3
        template:
          metadata:
            labels:
              app: seaweedfs-s3
          spec:
            containers:
              - name: seaweedfs
                image: chrislusf/seaweedfs:latest
                args:
                  - server
                  - -s3
                  - -s3.config=/etc/seaweedfs/s3.json
                  - -dir=/data
                ports:
                  - containerPort: 8333
                volumeMounts:
                  - name: config
                    mountPath: /etc/seaweedfs
                  - name: data
                    mountPath: /data
                readinessProbe:
                  tcpSocket:
                    port: 8333
                  initialDelaySeconds: 2
                  periodSeconds: 2
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
            volumes:
              - name: config
                configMap:
                  name: seaweedfs-s3-config
              - name: data
                persistentVolumeClaim:
                  claimName: seaweedfs-s3-pvc
  providerConfigRef:
    name: kubernetes-provider
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: seaweedfs-s3-service
  namespace: "{{ namespace }}"
spec:
  forProvider:
    manifest:
      apiVersion: v1
      kind: Service
      metadata:
        name: seaweedfs-s3
        namespace: "{{ namespace }}"
      spec:
        selector:
          app: seaweedfs-s3
        ports:
          - port: 8333
            targetPort: 8333
  providerConfigRef:
    name: kubernetes-provider
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-var-configmap-coder-app
  namespace: "{{ namespace }}"
data:
  SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
  AWS_ENDPOINT_URL: http://seaweedfs-s3:8333
