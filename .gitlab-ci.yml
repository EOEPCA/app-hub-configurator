stages:
  - lint
  - format
  - test
  - build
  - scan
  - push

# --------------------------------------------------------------------
# Global anchors
# --------------------------------------------------------------------

.default_python: &default_python
  image: python:3.12-slim
  interruptible: true

.install_yq: &install_yq
  - |
    set -euo pipefail
    VERSION=v4.45.1
    BINARY=yq_linux_amd64
    wget -q https://github.com/mikefarah/yq/releases/download/${VERSION}/${BINARY}.tar.gz -O - \
      | tar xz
    mv ${BINARY} /usr/bin/yq

.extract_app_meta: &extract_app_meta
  - |
    set -euo pipefail
    APP_VERSION=$(python3 -c "from src.snapping_evo.__about__ import __version__; print(__version__)")
    APP_NAME=$(yq .project.name -oy pyproject.toml)
    echo "APP_NAME=${APP_NAME}"
    echo "APP_VERSION=${APP_VERSION}"

.check_tag_matches_version: &check_tag_matches_version
  - |
    set -euo pipefail
    if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
      TAG_VERSION="${CI_COMMIT_TAG#v}"
      if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
        echo "ERROR: Git tag (${CI_COMMIT_TAG}) does not match APP_VERSION (${APP_VERSION})"
        exit 1
      fi
    fi

# --------------------------------------------------------------------
# Lint / Format
# --------------------------------------------------------------------

.base_ruff:
  stage: lint
  <<: *default_python
  before_script:
    - pip install ruff pre-commit
    - ruff --version

ruff_check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab > code-quality-report.json
  artifacts:
    reports:
      codequality: code-quality-report.json

ruff_format:
  stage: format
  extends: .base_ruff
  needs: [ruff_check]
  script:
    - ruff format --diff

# --------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------

test:
  stage: test
  <<: *default_python
  needs: [ruff_format]
  before_script:
    - pip install hatch
  script:
    - |
      set -euo pipefail
      export CI_TEST_SKIP=1
      hatch run test:test-show-setup

# --------------------------------------------------------------------
# Container build (Kaniko)
# --------------------------------------------------------------------

container-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: [test]
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --no-push
      --tar-path image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

# --------------------------------------------------------------------
# Security scan & SBOM
# --------------------------------------------------------------------

container-scan:
  stage: scan
  needs:
    - container-build
  image:
    name: docker.io/aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - container-build
  script:
    - |
      TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL,UNKNOWN --format json  --input image.tar > trivy-report.json
  artifacts:
    when: always
    reports:
      sast: trivy-report.json
    paths:
      - trivy-report.json
    expire_in: 7 days

sbom:
  stage: scan
  image:
    name: aquasec/trivy:0.50.2
    entrypoint: [""]
  needs: [container-build]
  script:
    - TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db trivy image --format spdx-json --output trivy-sbom.json --input image.tar
  artifacts:
    when: always
    reports:
      dependency_scanning: trivy-sbom.json
    paths:
      - trivy-sbom.json

# --------------------------------------------------------------------
# Push Docker image (release: tags only)
# --------------------------------------------------------------------

container-push-release:
  stage: push
  image: ubuntu:24.04
  needs:
    - container-build
    - container-scan
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  before_script:
    - |
      set -euo pipefail
      apt-get -q update
      apt-get -q -y install skopeo wget ca-certificates python3
    - *install_yq
  script:
    - *extract_app_meta
    - *check_tag_matches_version
    - |
      set -euo pipefail
      skopeo copy \
        --dest-creds="${CR_USER}:${CR_PASSWORD}" \
        docker-archive:image.tar \
        "docker://cr.terradue.com/${CR_PROJECT}/${APP_NAME}:${APP_VERSION}"

# --------------------------------------------------------------------
# Push Docker image (:latest → main only)
# --------------------------------------------------------------------

container-push-latest:
  stage: push
  image: ubuntu:24.04
  needs:
    - container-build
    - container-scan
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  before_script:
    - |
      set -euo pipefail
      apt-get -q update
      apt-get -q -y install skopeo wget ca-certificates python3
    - *install_yq
  script:
    - *extract_app_meta
    - |
      set -euo pipefail
      skopeo copy \
        --dest-creds="${CR_USER}:${CR_PASSWORD}" \
        docker-archive:image.tar \
        "docker://cr.terradue.com/${CR_PROJECT}/${APP_NAME}:latest"

# --------------------------------------------------------------------
# Push Docker image (:latest-dev)
# --------------------------------------------------------------------

container-push-latest-dev:
  stage: push
  image: ubuntu:24.04
  needs:
    - container-build
    - container-scan
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never
  before_script:
    - |
      set -euo pipefail
      apt-get -q update
      apt-get -q -y install skopeo wget ca-certificates python3
    - *install_yq
  script:
    - *extract_app_meta
    - |
      set -euo pipefail
      skopeo copy \
        --dest-creds="${CR_USER}:${CR_PASSWORD}" \
        docker-archive:image.tar \
        "docker://cr.terradue.com/${CR_PROJECT}/${APP_NAME}:latest-dev"
